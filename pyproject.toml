[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "burotu"
version = "0.1.0"
description = "Multi-cancer early detection from cell-free DNA methylation, powered by Meta Muse models (research prototype)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Burotu" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
ml = ["numpy>=2.0", "pandas>=2.2", "pyarrow>=15", "scikit-learn>=1.5", "lightgbm>=4.3"]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
]
muse = ["torch>=2.6", "transformers>=5.21", "peft>=0.21", "accelerate"]
dev = ["burotu[ml,web]", "pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
burotu_web = ["templates/**/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # translated site copy: typographic apostrophes and spaces are intended

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]
"src/burotu_web/i18n.py" = ["E501"]  # translated copy: one sentence per line
