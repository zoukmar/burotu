<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Suivi{% endblock %} · Burotu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/site.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body class="admin">
<header class="topbar">
  <a class="brand" href="/">
    <svg viewBox="0 0 64 20" aria-hidden="true"><circle cx="6" cy="10" r="5" class="o"/><circle cx="32" cy="10" r="5" class="f"/><circle cx="58" cy="10" r="5" class="o"/></svg>
    burotu <span class="brand-sub">suivi</span>
  </a>
  {% if user %}
  {% set path = request.url.path %}
  <nav class="nav" aria-label="Suivi">
    <a href="/"{% if path == '/' or path.startswith('/bookings') %} aria-current="page"{% endif %}>Réservations</a>
    <a href="/sites"{% if path.startswith('/sites') %} aria-current="page"{% endif %}>Centres et horaires</a>
  </nav>
  <form method="post" action="/logout" class="topbar-end">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <span class="muted small">{{ user }}</span>
    <button class="btn btn-small btn-ghost" type="submit">Se déconnecter</button>
  </form>
  {% endif %}
</header>
<main id="main" class="wrap admin-main">{% block main %}{% endblock %}</main>
</body>
</html>
