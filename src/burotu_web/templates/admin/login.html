{% extends "admin/base.html" %}
{% block title %}{{ _('Sign in') }}{% endblock %}
{% block main %}
<form class="login" method="post" action="/login">
  <h1>{{ _('Sign in to tracking') }}</h1>
  {% if error %}<div class="errors" role="alert"><p>{{ error }}</p></div>{% endif %}
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="field">{{ _("Username") }}<input name="username" autocomplete="username" required autofocus></label>
  <label class="field">{{ _("Password") }}<input type="password" name="password" autocomplete="current-password" required></label>
  <button class="btn btn-block" type="submit">{{ _("Sign in") }}</button>
</form>
{% endblock %}
