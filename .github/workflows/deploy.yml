name: Deploy

# Every push to main: tests → GHCR image → SSH deployment to srv-prod-2.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never interrupt a running deployment

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/burotu-web

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Weights of the models in use (GitHub Releases, outside Git)
        run: PYTHONPATH=src python3 -m burotu.store fetch models
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Production
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://burotu.com
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" > ~/.ssh/config

      - name: Copy configuration
        run: scp deploy/docker-compose.yml deploy/deploy.sh prod:/opt/burotu/

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The token goes through stdin: it never shows in logs or in `ps` on the server.
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh prod \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null \
             && bash /opt/burotu/deploy.sh '${{ github.sha }}'; status=\$?; docker logout ghcr.io >/dev/null; exit \$status"

      - name: Check live site
        run: |
          for host in burotu.com admin.burotu.com; do
            curl -fsS --retry 5 --retry-delay 3 "https://$host/healthz" >/dev/null && echo "$host OK"
          done
