name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]  # main goes through deploy.yml, which calls this workflow
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Data and weights from the store (GitHub Releases, outside Git)
        run: |
          python -m burotu.store fetch models
          python -m burotu.store fetch refined

      - name: Ruff
        run: |
          ruff check src tests scripts --output-format github
          ruff format --check src tests scripts

      - name: Tests
        run: pytest

      - name: Docker image (build only)
        run: docker build -t burotu-web:ci .  # copies store/models fetched above
