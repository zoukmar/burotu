name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]  # main passe par deploy.yml, qui appelle ce workflow
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer
        run: pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests scripts --output-format github
          ruff format --check src tests scripts

      - name: Tests
        run: pytest

      - name: Image Docker (construction seule)
        run: docker build -t burotu-web:ci .
